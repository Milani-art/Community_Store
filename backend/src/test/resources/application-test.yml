# Loaded on top of application.yml when a test uses @ActiveProfiles("test").
# Tests run against an in-memory H2 database, so they need no MySQL server.
spring:
  datasource:
    url: jdbc:h2:mem:communitystore_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs256
