server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: community-store-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true

---
# MySQL Profile (Default for production & MySQL Workbench)
# Run with DB_USERNAME and DB_PASSWORD set to your MySQL Workbench credentials:
# e.g. set DB_USERNAME=root; set DB_PASSWORD=yourpassword
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/communitystore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: admin
    password: administrator
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# H2 In-Memory Profile (Fallback when local MySQL server is not running)
# Usage: set SPRING_PROFILES_ACTIVE=h2
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:communitystoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

---
app:
  jwt:
    secret: ${JWT_SECRET:9a2f8c4e1b7d3f6a8e0c2b5d7e9f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
