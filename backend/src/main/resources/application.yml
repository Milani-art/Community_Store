server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: community-store-backend

  # MySQL. Every value can be overridden with an environment variable,
  # so nobody has to commit their own password: ${ENV_NAME:default}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/communitystore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Johannesburg}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update   # creates/updates tables from the entities on startup
    show-sql: false

app:
  jwt:
    # Development default only. Set JWT_SECRET (32+ characters) anywhere that is not your laptop.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-0123456789}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
